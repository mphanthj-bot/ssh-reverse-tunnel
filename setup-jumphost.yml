---
- name: Setup Jump Host Environment for AI Ops & MCP Infrastructure
  hosts: localhost
  connection: local
  become: true
  vars:
    node_version: "20.x"
    working_dir: "/opt/ai-ops-center"
    admin_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    admin_home: "{{ ansible_env.HOME }}"

  tasks:
    - name: Ensure system repositories are updated & base dependencies installed
      apt:
        name:
          - curl
          - wget
          - git
          - build-essential
          - software-properties-common
          - python3-pip
          - python3-venv
          - ufw
          - fail2ban
        state: present
        update_cache: yes

    - name: Add NodeSource repository key
      apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        state: present

    - name: Add NodeSource repository for Node.js {{ node_version }}
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }} nodistro main"
        state: present
        filename: nodesource

    - name: Install Node.js & npm
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Add Docker official GPG key
      apt_key:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine & Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add admin user to docker group
      user:
        name: "{{ admin_user }}"
        groups: docker
        append: yes

    - name: Install Ansible & UV (fast Python package manager)
      pip:
        name:
          - ansible
          - ansible-lint
          - uv
        executable: pip3
        extra_args: --break-system-packages

    - name: Create working directory structure for AI Ops Center
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'
      loop:
        - "{{ working_dir }}"
        - "{{ working_dir }}/.mcp"
        - "{{ working_dir }}/inventory"
        - "{{ working_dir }}/playbooks"
        - "{{ working_dir }}/roles"

    - name: Create default inventory.ini file
      copy:
        dest: "{{ working_dir }}/inventory/hosts.ini"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        content: |
          [web_servers]
          # client1 ansible_host=192.168.1.10 ansible_user=root

          [db_servers]
          # client2 ansible_host=192.168.1.11 ansible_user=root

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3

    - name: Create ssh-mcp-config.json with Command Whitelist
      copy:
        dest: "{{ working_dir }}/ssh-mcp-config.json"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        content: |
          {
            "allowedCommands": [
              "ansible",
              "ansible-playbook",
              "ansible-inventory",
              "docker",
              "git",
              "systemctl",
              "df",
              "free",
              "uptime"
            ]
          }

    - name: Create mcp_config.json for AI Agent CLI (Claude Code / OpenCode / Cursor)
      copy:
        dest: "{{ working_dir }}/.mcp/mcp_config.json"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        content: |
          {
            "mcpServers": {
              "sysoperator-ansible": {
                "command": "npx",
                "args": ["-y", "mcp-sysoperator"],
                "env": {
                  "ANSIBLE_CONFIG": "{{ working_dir }}/ansible.cfg",
                  "ANSIBLE_INVENTORY": "{{ working_dir }}/inventory/hosts.ini"
                }
              },
              "ssh-bastion": {
                "command": "npx",
                "args": [
                  "-y",
                  "@uarlouski/ssh-mcp-server",
                  "--configPath={{ working_dir }}/ssh-mcp-config.json"
                ]
              }
            }
          }

    - name: Create AGENTS.md rulebook for AI CLI
      copy:
        dest: "{{ working_dir }}/AGENTS.md"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
        content: |
          # Rules for AI Agent CLI on Jump Host

          1. Inventory is strictly located at `inventory/hosts.ini`.
          2. NEVER run raw commands on Client nodes manually. ALWAYS write or use Ansible Playbooks.
          3. Validate Playbook syntax using `ansible-lint` or `--syntax-check` before execution.
          4. Ask for human confirmation before executing any `ansible-playbook` command.

  post_tasks:
    - name: Summary notice
      debug:
        msg: "Jump Host setup completed successfully! AI Ops Center is located at {{ working_dir }}"
